version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=development
      - MONGODB_URI=mongodb://admin:password123@mongodb:27017/weddinglk_dev?authSource=admin
      - REDIS_URL=redis://redis:6379
      - NEXTAUTH_SECRET=dev-secret-key-for-university-presentation
      - NEXTAUTH_URL=http://localhost:3000
      - GOOGLE_CLIENT_ID=dev-client-id
      - GOOGLE_CLIENT_SECRET=dev-client-secret
      - STRIPE_PUBLISHABLE_KEY=pk_test_dev
      - STRIPE_SECRET_KEY=sk_test_dev
      - OPENAI_API_KEY=sk-dev-key
      - JWT_SECRET=dev-jwt-secret
      - ENCRYPTION_KEY=12345678901234567890123456789012
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - mongodb
      - redis
    restart: unless-stopped
    command: npm run dev

  mongodb:
    image: mongo:7.0
    ports:
      - '27017:27017'
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password123
      - MONGO_INITDB_DATABASE=weddinglk_dev
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  mongodb_data:
  redis_data:
