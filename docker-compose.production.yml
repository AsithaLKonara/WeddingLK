version: "3.9"

services:
  # Main application
  app:
    build:
      context: .
      dockerfile: Dockerfile.production
    image: weddinglk/app:production
    container_name: weddinglk-app
    env_file:
      - env.production
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGODB_URI=mongodb://mongo:27017/weddinglk
      - REDIS_URL=redis://redis:6379
    ports:
      - "3000:3000"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - weddinglk-network

  # MongoDB database
  mongo:
    image: mongo:7.0
    container_name: weddinglk-mongo
    environment:
      MONGO_INITDB_DATABASE: weddinglk
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    networks:
      - weddinglk-network

  # Redis cache
  redis:
    image: redis:7.2-alpine
    container_name: weddinglk-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - weddinglk-network

  # Nginx reverse proxy
  nginx:
    image: nginx:1.25-alpine
    container_name: weddinglk-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - weddinglk-network

  # MongoDB Express (optional - for database management)
  mongo-express:
    image: mongo-express:1.0.0
    container_name: weddinglk-mongo-express
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "true"
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: password123
    ports:
      - "8081:8081"
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - weddinglk-network

volumes:
  mongo_data:
    driver: local
  redis_data:
    driver: local

networks:
  weddinglk-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16 