version: '3.8'

services:
  # WeddingLK Next.js Application
  weddinglk-app:
    build:
      context: .
      dockerfile: Dockerfile.working
    ports:
      - "3002:3000"
    environment:
      - NODE_ENV=development
      - MONGODB_URI=mongodb://mongodb:27017/weddinglk
      - NEXTAUTH_SECRET=your-development-secret-key
      - NEXTAUTH_URL=http://localhost:3002
      - REDIS_URL=redis://redis:6379
    depends_on:
      - mongodb
      - redis
    restart: unless-stopped
    networks:
      - weddinglk-network
    volumes:
      - .:/app
      - /app/node_modules

  # MongoDB Database
  mongodb:
    image: mongo:7.0
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password123
      - MONGO_INITDB_DATABASE=weddinglk
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
    networks:
      - weddinglk-network

  # Redis for caching and sessions
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - weddinglk-network

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local

networks:
  weddinglk-network:
    driver: bridge 